<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS.GIT | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .login-container {
            width: 350px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #243b55;
            margin-bottom: 10px;
        }

        p {
            color: gray;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #243b55;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #141e30;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>AWS.GIT</h1>

        <p>Welcome Back! Login to continue.</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter Email Address"
                required>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>

            <button type="submit">Login</button>

        </form>

        <div class="footer">
            <p>Welcome to AWS.GIT Project</p>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit",
            function(event) {
                event.preventDefault();

                alert("Login page working successfully!");

            }
        );
    </script>

</body>
</html>
