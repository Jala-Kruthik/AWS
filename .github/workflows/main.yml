name: Simple Build and Deploy

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Build Step
      run: echo "Building..."

    
    # 🔹 Simple Build (just for demo)
    - name: Build Step
      run: echo "HTML Build Completed"

    # 🔹 Upload HTML files
    - name: Upload Files

      uses: actions/upload-pages-artifact@v3
      with:
        path: .
    - name: Deploy to Pages
      uses: actions/deploy-pages@v4
    # 🔹 Deploy
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
