<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kruthik's Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #062f59;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 445px;
            background: white;
            padding: 60px 42px 42px;
            border-radius: 21px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #082b52;
            font-size: 25px;
            margin-bottom: 28px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #625eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #625eea;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #514bd8;
        }

        #message {
            margin-top: 15px;
            font-size: 13px;
            color: red;
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 45px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Kruthik's Portal</h1>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

            <p id="message"></p>

        </form>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === "staff" && password === "123") {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText =
                    "Login successful!";
            } else {
                document.getElementById("message").innerText =
                    "Invalid username or password!";
            }

        });
    </script>

</body>
</html>
